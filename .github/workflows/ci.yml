name: CI & Vercel Deployment Quality Gate

on:
  workflow_dispatch:
  # Temporarily disabled automatic triggers — uncomment below when ready to enable:
  # push:
  #   branches: ['*']
  # pull_request:
  #   branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint, Unit & E2E Tests, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared SDK (@skiddle/sdk)
        run: pnpm --filter @skiddle/sdk build

      - name: Run Monorepo Typecheck
        run: pnpm typecheck

      - name: Run Monorepo Linter
        run: pnpm lint

      - name: Run Unit Test Suite (SDK, CLI, Web)
        run: pnpm test:unit

      - name: Run End-to-End (E2E) & Contract Test Suite
        run: pnpm test:e2e

      - name: Run PHP SDK Syntax Check & Unit Tests
        run: |
          php -l php/autoloader.php
          for f in php/src/*.php; do php -l "$f"; done
          pnpm test:php

      - name: 'Run Full Production Build (Vercel Parity: SDK + Next.js 15 App)'
        run: pnpm build
